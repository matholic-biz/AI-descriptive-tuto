<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/matholic-design-system-e6d31222-91d3-47b9-aebe-84a65a8b8cf0/fonts/suit.css">
<link rel="stylesheet" href="_ds/matholic-design-system-e6d31222-91d3-47b9-aebe-84a65a8b8cf0/fonts/jetbrains-mono.css">
<link rel="stylesheet" href="_ds/matholic-design-system-e6d31222-91d3-47b9-aebe-84a65a8b8cf0/colors_and_type.css">
<link rel="stylesheet" href="_ds/matholic-design-system-e6d31222-91d3-47b9-aebe-84a65a8b8cf0/styles.css">
<script src="_ds/matholic-design-system-e6d31222-91d3-47b9-aebe-84a65a8b8cf0/_ds_bundle.js"></script>
<style>
  body { margin: 0; background: #F7F8F9; font-family: "SUIT Variable", SUIT, sans-serif; }
  a { color: #1677FF; text-decoration: none; }
  a:hover { text-decoration: underline; }
</style>
</helmet>
<div style="min-height: 100vh; padding: 28px 28px 40px; box-sizing: border-box; display: flex; flex-direction: column; gap: 16px; align-items: center;">

  <div style="width: 100%; max-width: 1440px; display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; flex-wrap: wrap;">
    <div style="display: flex; flex-direction: column; gap: 6px;">
      <div style="font-size: 13px; font-weight: 600; color: #1677FF; letter-spacing: -0.005em;">온보딩 가이드</div>
      <h1 style="margin: 0; font-size: 24px; font-weight: 700; color: #212121; letter-spacing: -0.005em;">Ⅱ. OMR답안지 출력</h1>
      <p style="margin: 0; font-size: 14px; line-height: 22px; color: #555;">시험대비 실전감각을 키우기 위해 OMR답안지로 학습을 진행합니다.</p>
    </div>
    <div style="display: flex; align-items: center; gap: 12px;">
      <span style="font-size: 13px; color: #777; white-space: nowrap;">{{ counter }}</span>
      <div style="display: flex; gap: 12px;">
        <button type="button" onClick="{{ prev }}" disabled="{{ atStart }}" style="height: 32px; padding: 0 14px; border-radius: 6px; border: 1px solid #D9D9D9; background: #fff; color: #555; font-family: inherit; font-size: 14px; font-weight: 500; white-space: nowrap; cursor: pointer; transition: all 150ms ease-out;" style-hover="border-color: #1677FF; color: #1677FF;">뒤로</button>
        <button type="button" onClick="{{ next }}" style="height: 32px; padding: 0 16px; border-radius: 6px; border: 1px solid #1677FF; background: #1677FF; color: #fff; font-family: inherit; font-size: 14px; font-weight: 600; white-space: nowrap; cursor: pointer; transition: all 150ms ease-out;" style-hover="background: #1890FF; border-color: #1890FF;">{{ nextLabel }}</button>
      </div>
    </div>
  </div>

  <div style="width: 100%; max-width: 1440px; display: flex; gap: 12px; flex-wrap: wrap;">
    <sc-for list="{{ steps }}" as="s" hint-placeholder-count="3">
      <button type="button" onClick="{{ s.go }}" style="{{ s.chipStyle }}">
        <span style="{{ s.noStyle }}">{{ s.no }}</span>
        <span style="font-size: 14px; font-weight: 500; color: #212121; text-align: left; letter-spacing: -0.005em;">{{ s.short }}</span>
      </button>
    </sc-for>
  </div>

  <div style="width: 100%; max-width: 1440px; position: relative; aspect-ratio: 2881 / 1532; border: 1px solid #D9D9D9; border-radius: 10px; overflow: hidden; background: #fff;">
    <img src="uploads/image%2021.png" alt="문제지 출력 화면" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; transition: opacity 320ms ease-out; opacity: {{ op0 }};">
    <img src="uploads/image%2022.png" alt="답안 조절바 드래그 화면" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; transition: opacity 320ms ease-out; opacity: {{ op1 }};">
    <img src="uploads/image%2023.png" alt="OMR 답안지 화면" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; transition: opacity 320ms ease-out; opacity: {{ op2 }};">
    <img src="uploads/pasted-1788576872170-0.png" alt="OMR 답안지 초기화면" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; transition: opacity 320ms ease-out; opacity: {{ op3 }};">

    <div style="{{ overlayStyle }}">
      <svg viewBox="0 0 100 100" preserveAspectRatio="none" style="position: absolute; inset: 0; width: 100%; height: 100%;">
        <defs>
          <mask id="omrSpot" maskUnits="userSpaceOnUse" maskContentUnits="userSpaceOnUse" x="0" y="0" width="100" height="100">
            <rect x="0" y="0" width="100" height="100" fill="#fff"></rect>
            <sc-for list="{{ holes }}" as="h" hint-placeholder-count="0">
              <rect x="{{ h.x }}" y="{{ h.y }}" width="{{ h.w }}" height="{{ h.h }}" fill="#000"></rect>
            </sc-for>
          </mask>
        </defs>
        <rect x="0" y="0" width="100" height="100" fill="{{ dimFill }}" mask="url(#omrSpot)"></rect>
      </svg>

      <sc-for list="{{ rings }}" as="r" hint-placeholder-count="0">
        <div style="{{ r.style }}"></div>
      </sc-for>

      <div style="{{ cardStyle }}">
        <div style="display: flex; align-items: center; gap: 8px;">
          <span style="display: inline-flex; align-items: center; justify-content: center; min-width: 22px; height: 22px; padding: 0 7px; border-radius: 6px; background: #E5F2FD; color: #1677FF; font-size: 12px; font-weight: 700;">{{ badge }}</span>
          <span style="font-size: 12px; font-weight: 500; color: #999; white-space: nowrap;">Ⅱ. OMR답안지 출력</span>
        </div>
        <div style="font-size: 16px; font-weight: 700; color: #212121; line-height: 24px; letter-spacing: -0.005em; text-wrap: pretty;">{{ title }}</div>
        <div style="font-size: 14px; line-height: 22px; color: #555; text-wrap: pretty;">{{ desc }}</div>
        <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-top: 4px;">
          <div style="display: flex; gap: 6px; align-items: center;">
            <sc-for list="{{ dots }}" as="d" hint-placeholder-count="4">
              <button type="button" onClick="{{ d.go }}" aria-label="{{ d.label }}" style="{{ d.style }}"></button>
            </sc-for>
          </div>
          <div style="display: flex; gap: 12px;">
            <button type="button" onClick="{{ prev }}" disabled="{{ atStart }}" style="height: 32px; padding: 0 12px; border-radius: 6px; border: 1px solid #D9D9D9; background: #fff; color: #555; font-family: inherit; font-size: 14px; font-weight: 500; white-space: nowrap; cursor: pointer; transition: all 150ms ease-out;" style-hover="border-color: #1677FF; color: #1677FF;">뒤로</button>
            <button type="button" onClick="{{ next }}" style="height: 32px; padding: 0 14px; border-radius: 6px; border: 1px solid #1677FF; background: #1677FF; color: #fff; font-family: inherit; font-size: 14px; font-weight: 600; white-space: nowrap; cursor: pointer; transition: all 150ms ease-out;" style-hover="background: #1890FF; border-color: #1890FF;">{{ nextLabel }}</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;accentColor&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#1677FF&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;options&quot;:[&quot;#1677FF&quot;,&quot;#389E0D&quot;,&quot;#D46B08&quot;]},&quot;dimOpacity&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:0.55,&quot;min&quot;:0.2,&quot;max&quot;:0.8,&quot;step&quot;:0.05,&quot;tsType&quot;:&quot;number&quot;}}">
const SHOTS = [
  "uploads/image%2021.png",
  "uploads/image%2022.png",
  "uploads/image%2023.png",
  "uploads/pasted-1788576872170-0.png"
];

const STEPS = [
  {
    shot: 0, badge: "안내", short: "온보딩 시작",
    title: "OMR답안지로 실전 감각 키우기",
    desc: "시험대비 실전감각을 키우기 위해 OMR답안지로 학습을 진행합니다. 네 단계만 따라오세요.",
    holes: [], card: { left: 50, top: 50, center: true }
  },
  {
    shot: 0, badge: "1", short: "[문제지 출력]에서 [OMR답안지] 선택",
    title: "[문제지 출력] → [OMR답안지] 버튼 선택",
    desc: "문제지 출력 화면에서 OMR답안지만 선택합니다.",
    holes: [
      { x: 1.4, y: 6.2, w: 5.4, h: 5.4 },
      { x: 85.3, y: 51.0, w: 13.3, h: 3.4 }
    ],
    card: { left: 60, top: 60 }
  },
  {
    shot: 3, badge: "2", short: "OMR답안지 초기화면 확인",
    title: "[OMR답안지] 선택 직후 초기화면",
    desc: "OMR답안지를 선택하면 객관식 답안 영역이 먼저 생성됩니다.",
    holes: [{ x: 31.3, y: 29.4, w: 11.0, h: 22.5 }],
    card: { left: 47, top: 30 }
  },
  {
    shot: 1, badge: "3", short: "[답안 조절바] 드래그",
    title: "[답안 조절바]로 영역 조정",
    desc: "조절바를 위아래로 드래그하여 서술형 답안 영역을 설정할 수 있습니다.",
    holes: [{ x: 31.5, y: 95.2, w: 40.8, h: 3.6 }],
    card: { left: 33, top: 56 }
  },
  {
    shot: 2, badge: "4", short: "[답안입력창] 확인 후 [출력하기]",
    title: "[답안입력창] 확인 후 [출력하기]",
    desc: "답안 영역 조정이 완료되었다면 출력하여 학생의 학습을 시작합니다.",
    holes: [
      { x: 32.3, y: 28.4, w: 10.0, h: 20.5 },
      { x: 32.3, y: 55.8, w: 41.0, h: 44.2 },
      { x: 82.3, y: 6.3, w: 11.0, h: 4.4 }
    ],
    card: { left: 47, top: 20 }
  }
];

class Component extends DCLogic {
  state = { step: 0, visible: false };

  componentDidMount() {
    this._timers = [];
    this._raf = requestAnimationFrame(() => this.setState({ visible: true }));
    this._key = (e) => {
      if (e.key === "ArrowRight") this.go(this.state.step + 1);
      if (e.key === "ArrowLeft") this.go(this.state.step - 1);
    };
    window.addEventListener("keydown", this._key);
  }

  componentWillUnmount() {
    window.removeEventListener("keydown", this._key);
    cancelAnimationFrame(this._raf);
    (this._timers || []).forEach(clearTimeout);
  }

  go(n) {
    const t = Math.max(0, Math.min(STEPS.length - 1, n));
    if (t === this.state.step) return;
    (this._timers || []).forEach(clearTimeout);
    this._timers = [];
    // 1) fade the spotlight + card out, 2) crossfade the screen, 3) fade back in
    this.setState({ visible: false });
    this._timers.push(setTimeout(() => this.setState({ step: t }), 170));
    this._timers.push(setTimeout(() => this.setState({ visible: true }), 400));
  }

  renderVals() {
    const i = this.state.step;
    const on = this.state.visible;
    const s = STEPS[i];
    const accent = this.props.accentColor ?? "#1677FF";
    const dim = this.props.dimOpacity ?? 0.55;

    const op = (k) => (k === s.shot ? 1 : 0);

    const overlayStyle = {
      position: "absolute",
      inset: 0,
      pointerEvents: "none",
      opacity: on ? 1 : 0,
      transition: "opacity 220ms ease-out"
    };

    const rings = s.holes.map((h) => ({
      style: {
        position: "absolute",
        left: h.x + "%", top: h.y + "%", width: h.w + "%", height: h.h + "%",
        border: "2px solid " + accent,
        borderRadius: "6px",
        boxSizing: "border-box",
        boxShadow: on ? "0 0 0 4px rgba(22,119,255,0.18)" : "0 0 0 0 rgba(22,119,255,0)",
        transform: on ? "scale(1)" : "scale(1.04)",
        transition: "box-shadow 320ms ease-out 120ms, transform 320ms ease-out 120ms"
      }
    }));

    const cardStyle = {
      position: "absolute",
      left: s.card.left + "%",
      top: s.card.top + "%",
      width: "min(400px, 42%)",
      background: "#fff",
      border: "1px solid #D9D9D9",
      borderRadius: "10px",
      padding: "20px",
      boxSizing: "border-box",
      display: "flex",
      flexDirection: "column",
      gap: "10px",
      boxShadow: "0 6px 16px rgba(0,35,11,0.2)",
      pointerEvents: "auto",
      transform: (s.card.center ? "translate(-50%, -50%)" : "translate(0, 0)") + (on ? " translateY(0)" : " translateY(6px)"),
      transition: "transform 260ms ease-out 100ms"
    };

    const dots = STEPS.map((st, k) => ({
      label: "단계 " + (k + 1),
      go: () => this.go(k),
      style: {
        width: k === i ? "18px" : "6px",
        height: "6px",
        borderRadius: "999px",
        border: "none",
        padding: 0,
        cursor: "pointer",
        background: k === i ? accent : "#D9D9D9",
        transition: "all 200ms ease-out"
      }
    }));

    const chips = STEPS.slice(1).map((st, k) => {
      const active = k + 1 === i;
      return {
        no: String(k + 1),
        short: st.short,
        go: () => this.go(k + 1),
        noStyle: {
          display: "inline-flex",
          alignItems: "center",
          justifyContent: "center",
          width: "20px",
          height: "20px",
          borderRadius: "6px",
          flex: "0 0 auto",
          fontSize: "12px",
          fontWeight: 700,
          background: active ? accent : "#F7F8F9",
          color: active ? "#fff" : "#777",
          transition: "all 150ms ease-out"
        },
        chipStyle: {
          flex: "1 1 240px",
          display: "flex",
          alignItems: "center",
          gap: "10px",
          padding: "14px 16px",
          borderRadius: "6px",
          background: active ? "#E5F2FD" : "#fff",
          border: "1px solid " + (active ? accent : "#D9D9D9"),
          fontFamily: "inherit",
          cursor: "pointer",
          textAlign: "left",
          transition: "all 150ms ease-out"
        }
      };
    });

    return {
      op0: op(0), op1: op(1), op2: op(2), op3: op(3),
      overlayStyle,
      holes: s.holes,
      rings,
      cardStyle,
      dimFill: "rgba(17,24,39," + dim + ")",
      badge: s.badge,
      title: s.title,
      desc: s.desc,
      counter: i === 0 ? "시작 안내" : i + " / " + (STEPS.length - 1),
      nextLabel: i === STEPS.length - 1 ? "처음으로" : (i === 0 ? "시작하기" : "다음으로"),
      atStart: i === 0,
      next: () => this.go(i === STEPS.length - 1 ? 0 : i + 1),
      prev: () => this.go(i - 1),
      dots,
      steps: chips
    };
  }
}
</script>
</body>
</html>
